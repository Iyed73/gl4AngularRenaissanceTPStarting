@if (allProducts(); as productsList) {
  <button class="btn btn-primary mb-3"
    (click)="loadMoreProducts()"
    [disabled]="noMoreProducts() || isLoading()">
    More Products
  </button>
  @if (noMoreProducts()) {
    <div class="alert alert-danger mt-3">
      No more products to load.
    </div>
  }
  <div class="alert alert-warning mt-3">
    Products Number: {{ productsList.length }}
  </div>
  <div class="row">
    @for (product of productsList; track product) {
      <div class="col-4 mb-3">
        <div class="product-card">
          <img class="product-img" [src]="product.thumbnail" [alt]="product.title">
          <div class="product-title">{{ product.title }}</div>
          <div class="product-meta">
            <div class="product-price">$ {{ product.price }}</div>
            <div class="product-category">{{ product.category }}</div>
          </div>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
}
